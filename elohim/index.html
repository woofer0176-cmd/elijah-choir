<html lang="ko">
<head>

<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>엘로힘 중창단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: 밝은 첫 아침 콘셉트. 상단은 오선(五線) 위에 이번 주 7일을 음표처럼 놓은 주간 띠, 본문은 여백 넓은 단일 컬럼, 하단은 떠 있는 알약형 탭 */
:root{
  --bg:#f7f8f4; --paper:#ffffff; --ink:#1c2420; --muted:#68736d; --line:#e3e8e1;
  --leaf:#1f7a5c; --leaf-soft:#e3f1ea; --dawn:#ef8f4a; --dawn-soft:#fdeedf;
  --s:#d2557a; --a:#e0912e; --t:#2f7fb0; --b:#4d7a3a; --pi:#7a5fa8;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --navh:62px;
  --bg2:#e8eee7; --band1:#1d6e53; --band2:#2e8d69; --mint:#9be6c3; --edge:rgba(255,255,255,.75);
  --sh1:0 1px 2px rgba(22,48,36,.07),0 6px 16px rgba(22,48,36,.09);
  --sh2:0 2px 6px rgba(22,48,36,.08),0 16px 34px rgba(22,48,36,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --paper:#1b201d; --ink:#e9efe9; --muted:#9aa59f; --line:#2b332e;
  --leaf:#6fcca6; --leaf-soft:#1c3129; --dawn:#f4a66e; --dawn-soft:#3a2a1d;
  --s:#ee8eaa; --a:#efb267; --t:#7fbde3; --b:#9fc98b; --pi:#b9a2e0; --bg2:#0e1210; --band1:#123b2d; --band2:#1b5440; --mint:#7fd8b0; --edge:rgba(255,255,255,.05); --sh1:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.35); --sh2:0 2px 6px rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --paper:#1b201d; --ink:#e9efe9; --muted:#9aa59f; --line:#2b332e;
  --leaf:#6fcca6; --leaf-soft:#1c3129; --dawn:#f4a66e; --dawn-soft:#3a2a1d;
  --s:#ee8eaa; --a:#efb267; --t:#7fbde3; --b:#9fc98b; --pi:#b9a2e0; --bg2:#0e1210; --band1:#123b2d; --band2:#1b5440; --mint:#7fd8b0; --edge:rgba(255,255,255,.05); --sh1:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.35); --sh2:0 2px 6px rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(var(--navh) + 40px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* 상단 */
.top{padding-block:18px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--leaf);font-weight:600}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:31.5px;margin:2px 0 0;letter-spacing:-.01em;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--dawn)}
.who{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;flex-shrink:0}
.who small{color:var(--muted);font-size:12px}
.who b{color:var(--leaf)}

/* 오선 주간 띠 */
.staff{position:relative;margin-top:14px;height:96px;background:
  linear-gradient(var(--line),var(--line)) 0 22px/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 34px/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 46px/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 58px/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 70px/100% 1px no-repeat;
  display:grid;grid-template-columns:repeat(6,1fr)}
.day{position:relative;display:flex;flex-direction:column;align-items:center}
.day .head{position:absolute;width:22px;height:16px;border-radius:50%;background:var(--muted);opacity:.35;transform:rotate(-20deg)}
.day.pr .head,.day.su .head{opacity:1}
.day.pr .head{background:var(--leaf)} .day.su .head{background:var(--dawn)}
.day.today .head{outline:3px solid var(--paper);box-shadow:0 0 0 5px var(--ink)}
.day .lab{position:absolute;bottom:0;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.25;font-variant-numeric:tabular-nums}
.day.pr .lab,.day.su .lab{color:var(--ink);font-weight:600}
.mon{position:relative}
.mon .h{position:absolute;left:50%;width:20px;height:15px;border-radius:50%;transform:rotate(-20deg)}
.mon .h.pr{background:var(--leaf);top:28px;margin-left:-19px}
.mon .h.pf{background:var(--dawn);top:40px;margin-left:-1px}
.mon .lab{position:absolute;bottom:0;left:0;right:0;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.25;font-variant-numeric:tabular-nums}
.mon.cur .lab{color:var(--ink);font-weight:700}
.mon.cur::after{content:"";position:absolute;inset:14px 4px 28px;border-radius:10px;border:1.5px solid var(--ink);opacity:.5}
.mon.moved .lab::after{content:" *";color:var(--dawn)}
.legend{display:flex;gap:14px;font-size:13.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

main{display:flex;flex-direction:column;gap:26px;padding-top:20px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-family:var(--f-display);font-size:22.5px;margin:0;text-wrap:balance}
.sec-h a,.link{color:var(--leaf);font-size:14.5px;text-decoration:none;font-weight:600;background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
.muted{color:var(--muted)} .small{font-size:14.5px} .num{font-variant-numeric:tabular-nums}

/* 창단 카운트다운 */
.dawn{border-radius:20px;padding:18px 20px;background:linear-gradient(160deg,var(--dawn-soft),var(--leaf-soft));display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.dawn .dd{grid-row:span 2;font-family:var(--f-display);font-size:45px;font-weight:700;color:var(--dawn);line-height:1;font-variant-numeric:tabular-nums}
.dawn .dd small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.dawn b{font-size:18px} .dawn span{font-size:14.5px;color:var(--muted)}

/* 가로로 넘기는 찬양 카드 */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding-inline:max(18px,env(safe-area-inset-left,0px));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.sheetcard{flex:0 0 78%;scroll-snap-align:start;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sheetcard .when{font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sheetcard .ttl{font-family:var(--f-display);font-size:23.5px;font-weight:700;line-height:1.3}
.sheetcard .foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.play{width:38px;height:38px;border-radius:50%;background:var(--leaf);color:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.play svg{width:14px;height:14px;fill:currentColor}
.pts{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.pts li{font-size:14.5px;display:flex;gap:7px;line-height:1.45}
.pts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dawn);margin-top:7px;flex-shrink:0}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.parts a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
#pm[hidden]{display:none}
#pm{position:fixed;inset:0;z-index:60;background:rgba(10,15,12,.8);display:flex;align-items:center;justify-content:center;padding:16px}
#pm .box{width:100%;max-width:480px;background:var(--paper);border-radius:20px;overflow:hidden}
#pm .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--leaf);color:var(--paper);font-weight:600}
#pm .hd button{background:none;border:0;color:inherit;font-size:22.5px;cursor:pointer;padding:0 4px}
#pm .crop{position:relative;width:100%;aspect-ratio:16/13.5;max-height:calc(100vh - 110px);overflow:hidden;background:#000}
#pm iframe{position:absolute;top:-19.7%;left:0;width:100%;height:119.7%;border:0}
@media (max-width:600px){#pm{padding:8px}#pm .crop{aspect-ratio:auto;height:calc(100vh - 90px);height:calc(100dvh - 90px);max-height:none;background:#fff}#pm iframe{top:0;height:100%}}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--sh2)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ex{font-size:12px;color:var(--dawn);border:1px solid var(--dawn);border-radius:4px;padding:0 5px;font-weight:700}

/* 목록 */
.rows{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.r{display:flex;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0}
.r:first-child{border-top:0}
.r .grow{flex:1;min-width:0}
.r .t{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.S{--p:var(--s)}.A{--p:var(--a)}.T{--p:var(--t)}.B{--p:var(--b)}.P{--p:var(--pi)}
.dot{background:var(--p)}
.ini{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent);flex-shrink:0}
.badge{font-size:12.5px;font-weight:600;color:var(--leaf);background:var(--leaf-soft);border-radius:999px;padding:1px 8px}

/* 세그먼트 */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding-inline:max(18px,env(safe-area-inset-left,0px))}
.seg::-webkit-scrollbar{display:none}
.seg button{flex-shrink:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--paper);font-weight:600}

/* 파트 구성 막대 */
.mix{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.mix i{background:var(--p)}
.mixlab{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.mixlab b{color:var(--ink)}

/* 출석: 원형 칩 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:6px 0}
.chip .ini{width:52px;height:52px;font-size:18px;border:2px dashed color-mix(in srgb,var(--p) 50%,transparent);background:transparent}
.chip[aria-pressed="true"] .ini{background:var(--p);color:var(--paper);border:2px solid var(--p)}
.chip span{font-size:14px}
.chip:disabled{cursor:default}
.ring{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}
.ring svg{width:76px;height:76px;flex-shrink:0}
.ring .big{font-family:var(--f-display);font-size:29px;font-weight:700}

/* 연간 */
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mo .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mo b{font-size:15px;line-height:1.35}
.mo.special{background:var(--dawn-soft);border-color:transparent}
.mo.now{outline:2px solid var(--leaf)}
table.bud{width:100%;border-collapse:collapse;font-size:15.5px}
table.bud td{padding:10px 0;border-top:1px solid var(--line)}
table.bud tr:first-child td{border-top:0}
table.bud td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.bud tr.sum td{font-weight:700}

/* 하단 알약 탭 */
nav.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;
  width:min(440px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));height:var(--navh);background:var(--ink);border-radius:999px;
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
nav.pill a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--bg);opacity:.6;text-decoration:none;font-size:12px;border-radius:999px;white-space:nowrap;letter-spacing:-.02em}
nav.pill a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.pill a[aria-current="page"]{opacity:1;background:var(--leaf);color:var(--paper);font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--paper);border-radius:24px 24px 0 0;
  padding-top:14px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-size:26px;margin:0}
.score{border-radius:14px;aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-size:14.5px;
  background:repeating-linear-gradient(var(--paper) 0 10px,var(--line) 10px 11px,var(--paper) 11px 12px) ,var(--paper);border:1px solid var(--line)}
.score span{background:var(--paper);padding:3px 8px;border-radius:6px}
.btn{border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--leaf);color:var(--paper);text-align:center;text-decoration:none;display:block}
.btn.soft{background:var(--leaf-soft);color:var(--leaf)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:var(--muted)}
label.f input,label.f textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.guide{white-space:pre-line;background:var(--bg);border-radius:14px;padding:14px;font-size:16px}
.kv{display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));background:var(--dawn);color:#1c2420;padding:8px 16px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:50;white-space:nowrap}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .24s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}
  .day.pr .head,.day.su .head{animation:pop .5s ease-out both}@keyframes pop{from{transform:rotate(-20deg) scale(.4)}}
}

/* ===== 입체감 레이어 ===== */
body{background:var(--bg2)}
body::before{background:var(--band1)}
.hero-band{background:linear-gradient(165deg,var(--band1),var(--band2));border-radius:0 0 28px 28px;box-shadow:var(--sh2);padding-bottom:16px;position:relative;overflow:hidden}
.hero-band::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,140,.35),transparent 70%);pointer-events:none}
.hero-band .brand h1{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.hero-band .brand h1 em{color:#ffc58f}
.hero-band .eyebrow{color:var(--mint)}
.hero-band .who{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);position:relative;z-index:1}
.hero-band .who small{color:rgba(255,255,255,.75)} .hero-band .who b{color:#fff}
.hero-band .staff{background:
  linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) 0 22px/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) 0 34px/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) 0 46px/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) 0 58px/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) 0 70px/100% 1px no-repeat}
.hero-band .mon .h.pr{background:var(--mint);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.hero-band .mon .h.pf{background:#ffb27a;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.hero-band .mon .lab{color:rgba(255,255,255,.7)} .hero-band .mon.cur .lab{color:#fff}
.hero-band .mon.cur::after{border-color:#fff;opacity:.6;background:rgba(255,255,255,.08)}
.hero-band .legend{color:rgba(255,255,255,.8)}
.hero-band .legend i[style*="leaf"]{background:var(--mint)!important}
.hero-band .legend i[style*="dawn"]{background:#ffb27a!important}
main{gap:30px;padding-top:22px}
.sec-h h2{display:flex;align-items:center;gap:9px}
.sec-h h2::before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--dawn),var(--leaf));flex-shrink:0}
.rows,.ring,.mo,.stat,.parts a{border:1px solid var(--edge);box-shadow:var(--sh1)}
.rows{border-radius:20px}
.sheetcard{border:1px solid var(--edge);box-shadow:var(--sh2);background:linear-gradient(180deg,var(--paper),color-mix(in srgb,var(--paper) 92%,var(--leaf-soft)))}
.dawn{box-shadow:var(--sh2);border:1px solid var(--edge);background:linear-gradient(150deg,var(--dawn-soft),var(--paper) 55%,var(--leaf-soft))}
.dawn .dd{text-shadow:0 3px 10px color-mix(in srgb,var(--dawn) 35%,transparent)}
.play{background:linear-gradient(150deg,color-mix(in srgb,var(--leaf) 70%,#ffffff),var(--leaf));box-shadow:0 4px 10px color-mix(in srgb,var(--leaf) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn{box-shadow:0 6px 14px color-mix(in srgb,var(--leaf) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.soft{box-shadow:var(--sh1)}
.seg button{border-color:var(--edge);box-shadow:var(--sh1)}
.seg button[aria-pressed="true"]{background:linear-gradient(150deg,color-mix(in srgb,var(--leaf) 75%,#ffffff),var(--leaf));box-shadow:0 5px 12px color-mix(in srgb,var(--leaf) 35%,transparent)}
.seg{padding-block:4px 10px}
.ini{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.chip[aria-pressed="true"] .ini{box-shadow:0 6px 14px color-mix(in srgb,var(--p) 45%,transparent)}
.mo.special{border-color:transparent;background:linear-gradient(160deg,var(--dawn-soft),var(--paper))}
.mix{box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
nav.pill{box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08)}
nav.pill a[aria-current="page"]{box-shadow:0 4px 12px color-mix(in srgb,var(--leaf) 50%,transparent)}
.r,.sheetcard,.parts a,.seg button,.btn,.chip{transition:transform .12s ease}
.r:active,.sheetcard:active,.parts a:active,.btn:active,.chip:active{transform:scale(.98)}
</style>
</head>
<body>


<div class="app">
  <div class="wrap hero-band">
    <div class="top">
      <div class="brand">
        <div class="eyebrow">ELOHIM ENSEMBLE · 2027</div>
        <h1>엘로힘 <em>중창단</em></h1>
      </div>
      <button class="who" id="who" aria-label="권한 바꾸기"><small>지금 보기</small><b id="whoLab">대원</b></button>
    </div>
    <div id="staff"></div>
  </div>
  <main class="wrap" id="view"></main>
</div>

<nav class="pill" aria-label="메인 메뉴">
  <a href="#home" data-t="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>오늘</a>
  <a href="#music" data-t="music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>찬양</a>
  <a href="#members" data-t="members"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.6c2.6.2 4.5 2 5.2 4.9"/></svg>섬기는 분들</a>
  <a href="#attend" data-t="attend"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>출석</a>
  <a href="#news" data-t="news"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg>소식</a>
</nav>

<div id="pm" hidden><div class="box"><div class="hd"><span id="pmT"></span><button id="pmX" aria-label="닫기">✕</button></div><div class="crop"><iframe id="pmF" src="about:blank" allow="autoplay; fullscreen" allowfullscreen title="연습 플레이어"></iframe></div></div></div>
<script>
/* ===== 「엘로힘 중창단 2027년도 조직·행사·예산 보고서」 ===== */
const ORG={"리더 (Leader)":"한흥재","뮤직 디렉터 (Music Director)":"장동일","피아니스트 (Pianist)":"이미경","매니저 (Manager)":"김선옥"};
const PARTS={S:"소프라노",A:"알토",T:"테너",B:"베이스",P:"반주"};
const ALL=["S","A","T","B","P"];
const MEMBERS=[["윤정선","S"],["강혜진","S"],["황민정","S"],["박영미","S"],["박한주","S"],["김선옥","S"],["양길숙","S"],
  ["민은영","A"],["조지연","A"],["김민정D","A"],["한흥재","T"],["장동일","T"],["박종철","B"],["송재천","B"],["이미경","P"]]
  .map(([name,part],i)=>({id:"m"+i,name,part,role:Object.keys(ORG).filter(k=>ORG[k]===name)}));
const EVENTS=[[1,"신년찬양","신년회 / 엘로힘 중창단 창단"],[2,"사순절 찬양","부활절 찬양준비"],[3,"부활절 찬양","중창단 자체 세미나"],
  [4,"정기찬양","1분기 평가 모임"],[5,"가정의 달 찬양","남성단원 추가 모집"],[6,"정기찬양","맥추 감사절 찬양준비"],
  [7,"맥추감사 찬양","상반기 평가 모임 / 하반기 레파토리 배부"],[8,"정기찬양","하계수련회(1일)"],[9,"정기찬양",""],
  [10,"정기찬양","3분기 평가 모임 / 성탄발표곡 준비"],[11,"추수감사 찬양",""],[12,"성탄찬양","성탄절 발표 / 송년회 및 하반기 평가모임"]];
const BUDGET={in:[["엘로힘 중창단 예산",500000]],out:[["행사 준비 및 간식",500000]]};
/* 예시 곡: 실제 곡으로 바꿔 넣는 자리 */
const PTS={
  s1:[],
  s3:["레가토로 길게 잇기","끝음 4박 꽉 채우기"],
  s4:["3절 크레셴도 단계적으로","소프라노 고음 머리 공명"],
  s5:["'아멘' 충분히 늘이기","시작음 반주 없이 잡기"]};
const SONGS_SEED=[
  {id:"s1",m:1,real:true,title:"너는 물댄 동산 같겠고",voicing:"편성 미정",key:"",url:"https://joongangart.kr/TheWay/05/pop1.html",yt:"PYEFwOl5IWw",guide:"창단 첫 연주(3부예배). 찬양가이드를 준비 중입니다."},
  {id:"s3",m:2,title:"참 아름다워라",voicing:"SATB",key:"Eb",guide:"사순절 찬양. 레가토로 길게."},
  {id:"s4",m:3,title:"주 달려 죽은 십자가",voicing:"SATB",key:"D",guide:"부활절 준비곡. 3절 크레셴도 연습."},
  {id:"s5",cat:"송영곡",title:"찬양 성부 성자 성령",voicing:"SATB",key:"G",guide:"예배 시작 송영. 마지막 '아멘'은 충분히 늘여서."}
].map(s=>({...s,ex:!s.real,pts:PTS[s.id]||[]}));
const ptsHtml=s=>(s.pts&&s.pts.length)?`<ul class="pts">${s.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
const CATS=["월별 연주 찬양","연주한 찬양","송영곡"];

/* ===== 저장 (이 기기에만) ===== */
const store={get(k,d){try{const v=localStorage.getItem("elohim6."+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("elohim2."+k,JSON.stringify(v))}catch(e){}}};
let role=store.get("role","member"),contacts=store.get("contacts",{}),attendance=store.get("att",{}),songs=store.get("songs",null)||SONGS_SEED.map(s=>({...s}));
songs.forEach(x=>{const d=SONGS_SEED.find(y=>y.id===x.id);if(d&&d.yt&&x.yt===undefined)x.yt=d.yt});
function ytId(u){const m=/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/.exec(u||"");return m?m[1]:""}
function ytBlock(s){
  if(!/github\.io$/.test(location.hostname))return `<a class="btn" href="https://youtu.be/${esc(s.yt)}" target="_blank" rel="noopener">▶ 합창 영상 보기 (유튜브)</a>`;
  return `<div class="yt"><iframe src="https://www.youtube.com/embed/${esc(s.yt)}?playsinline=1&rel=0" title="${esc(s.title)} 합창 영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
}
let cat="월별 연주 찬양",partF="all",attDate=null,songPart="S",lastSong=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const leader=()=>role==="leader";
const byName=(a,b)=>a.name.localeCompare(b.name,"ko");
const cnt=p=>MEMBERS.filter(m=>m.part===p).length;
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

/* ===== 날짜 ===== */
const today=new Date();today.setHours(0,0,0,0);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const W="일월화수목금토";
const parse=x=>{const[y,m,d]=x.split("-").map(Number);return new Date(y,m-1,d)};
const SY=2027;
let sched=store.get("sched",{}); /* 월별로 옮긴 날짜 {"3":{pr:"2027-03-06",pf:"..."}} */
function nth(m,dow,n){const d=new Date(SY,m-1,1);d.setDate(1+(dow-d.getDay()+7)%7+7*(n-1));return d}
function eve(d){const x=new Date(d);x.setDate(x.getDate()-1);return x}
function sch(m){const o=sched[m]||{},pf=o.pf?parse(o.pf):nth(m,0,3);return{pr:o.pr?parse(o.pr):eve(pf),pf,moved:!!(o.pr||o.pf)}}
function upcoming(k){for(let m=1;m<=12;m++){const d=sch(m)[k];if(d>=today)return{m,d}}return null}
const md=x=>{const d=typeof x==="string"?parse(x):x;return`${d.getMonth()+1}/${d.getDate()}`};
const dn=d=>{const n=Math.round((d-today)/864e5);return n===0?"오늘":n>0?`D-${n}`:"지남"};
const FIRST=()=>sch(1).pf; /* 첫 연주 = 창단 */
const dday=()=>Math.round((FIRST()-today)/864e5);
const curMonth=()=>today<FIRST()||today.getFullYear()<SY?1:today.getFullYear()>SY?12:today.getMonth()+1;

function staff(){
  const c=curMonth(),st=Math.min(Math.max(c,1),7);
  return `<div class="staff" aria-label="다가오는 연습과 연주">${[...Array(6)].map((_,i)=>{const m=st+i,x=sch(m);
    return `<div class="mon ${m===c?"cur":""} ${x.moved?"moved":""}"><span class="h pr"></span><span class="h pf"></span><span class="lab">${m}월<br>${x.pr.getDate()}·${x.pf.getDate()}</span></div>`}).join("")}</div>
  <div class="legend"><span><i style="background:var(--leaf)"></i>연습 · 연주 전날 토</span><span><i style="background:var(--dawn)"></i>연주 · 3주 주일 3부예배</span></div>`;
}

/* ===== 화면 ===== */
const V={};
const songCard=s=>`<button class="sheetcard" data-song="${s.id}">
  <div class="when"><span>${songWhen(s)}</span><span class="ex">예시</span></div>
  <div class="ttl">${esc(s.title)}</div>${ptsHtml(s)}
  <div class="foot"><span class="play" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></span><span class="small muted">${esc(s.voicing)}${s.key?` · ${esc(s.key)}조`:""}<br>악보 · 파트 음원 · 가이드</span></div></button>`;

V.home=()=>{
  const np=upcoming("pr"),nf=upcoming("pf"),dd=dday(),ev=EVENTS[curMonth()-1];
  const pk=np?ymd(np.d):null,pres=pk?(attendance[pk]||[]).length:0;
  return `
  ${dd>0?`<section class="dawn"><div class="dd"><small>첫 연주까지</small>D-${dd}</div><b>${md(FIRST())} (주일) 3부예배</b><span>신년찬양 · 엘로힘 창단 무대</span></section>`
        :`<section class="dawn"><div class="dd"><small>${ev[0]}월</small>${esc(ev[1]).slice(0,2)}</div><b>${esc(ev[1])}</b><span>${esc(ev[2])}</span></section>`}
  <section class="sec"><div class="sec-h"><h2>다가오는 두 날</h2><a href="#news">연간 일정 ›</a></div>
    <div class="rows">
      ${np?`<a class="r" href="#attend" style="text-decoration:none"><span class="dot" style="background:var(--leaf)"></span><div class="grow"><div class="t">연습 · ${md(np.d)} (토)</div><div class="small muted">연주 전날 토요일 · 120분 · 출석 ${pres}/${MEMBERS.length}</div></div><b class="num" style="color:var(--leaf)">${dn(np.d)}</b></a>`:""}
      ${nf?`<div class="r" style="cursor:default"><span class="dot" style="background:var(--dawn)"></span><div class="grow"><div class="t">연주 · ${md(nf.d)} (주일) 3부예배</div><div class="small muted">${nf.m}월 ${esc(EVENTS[nf.m-1][1])}</div></div><b class="num" style="color:var(--dawn)">${dn(nf.d)}</b></div>`:""}
    </div>
    <p class="note">날짜는 교회 일정에 따라 바뀔 수 있습니다. 바뀐 달은 위 오선에 * 표시가 붙습니다.</p></section>
  <section class="sec"><div class="sec-h"><h2>이번 달 연주 찬양</h2><a href="#music">모두 보기</a></div>
    <div class="rail">${(()=>{const u=upcoming("pf"),l=songs.filter(s=>s.cat!=="송영곡"&&u&&s.m===u.m);return l.length?l.map(songCard).join(""):`<div class="small muted">이번 달 곡이 아직 없습니다.</div>`})()}</div></section>
  <section class="sec"><div class="sec-h"><h2>함께하는 목소리</h2><a href="#members">명단 ›</a></div>${mix()}</section>
  <section class="sec"><div class="sec-h"><h2>공지</h2></div>
    <div class="rows">
      <div class="r" style="cursor:default"><span class="badge">창단</span><div class="grow"><div class="t">1월 신년찬양에서 첫 무대를 섭니다</div><div class="small muted">${md(FIRST())} 주일 3부예배 · 리더 한흥재</div></div></div>
      <div class="r" style="cursor:default"><span class="badge">모집</span><div class="grow"><div class="t">남성 단원을 찾습니다</div><div class="small muted">5월 집중 모집 · 주변 추천 부탁드립니다</div></div></div>
    </div></section>`;
};
function mix(){return `<div class="mix">${["S","A","T","B"].map(p=>`<i class="${p}" style="flex:${cnt(p)}"></i>`).join("")}</div>
  <div class="mixlab">${["S","A","T","B"].map(p=>`<span><b>${PARTS[p]}</b> ${cnt(p)}</span>`).join("")}</div>`}

const songCat=s=>s.cat==="송영곡"?"송영곡":sch(s.m||1).pf<today?"연주한 찬양":"월별 연주 찬양";
const songWhen=s=>s.cat==="송영곡"?"송영곡 · 매 연주":`${s.m}월 · ${md(sch(s.m).pf)} 3부예배`;
const songRow=s=>`<button class="r" data-song="${s.id}"><span class="play" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></span><div class="grow"><div class="t" style="font-family:var(--f-display);font-size:19px">${esc(s.title)} ${s.ex?'<span class="ex">예시</span>':""}</div><div class="small muted">${esc(s.voicing)}${s.key?` · ${esc(s.key)}조`:""}</div>${ptsHtml(s)}</div><span class="muted">›</span></button>`;
V.music=()=>{
  const list=songs.filter(s=>songCat(s)===cat);
  let body;
  if(cat==="송영곡"){body=`<div class="rows">${list.map(songRow).join("")||'<div class="r small muted">아직 없습니다.</div>'}</div>${leader()?'<button class="btn soft" data-addm="0">+ 송영곡 추가</button>':""}`}
  else{
    const months=cat==="월별 연주 찬양"?[...Array(12)].map((_,i)=>i+1).filter(m=>sch(m).pf>=today):[...new Set(list.map(s=>s.m))].sort((a,b)=>b-a);
    body=months.map(m=>{const l=list.filter(s=>s.m===m),ev=EVENTS[m-1];
      if(cat==="월별 연주 찬양"&&!l.length&&!leader()&&m>curMonth()+2)return "";
      return `<section class="sec"><div class="sec-h"><h2 style="font-size:19px">${m}월 <span class="small muted" style="font-family:var(--f-body)">${md(sch(m).pf)} 3부예배 · ${esc(ev[1])}</span></h2>${leader()&&cat==="월별 연주 찬양"?`<button class="link" data-addm="${m}">+ 곡</button>`:""}</div>
      <div class="rows">${l.map(songRow).join("")||'<div class="r small muted" style="cursor:default">아직 정한 곡이 없습니다.</div>'}</div></section>`}).join("")
      ||`<div class="rows"><div class="r small muted" style="cursor:default">1월 17일 첫 연주가 끝나면 이곳에 쌓입니다.</div></div>`;
  }
  return `
  <div class="seg" role="group" aria-label="찬양 분류">${CATS.map(c=>`<button data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("")}</div>
  ${body}
  <p class="note">연주 날짜(3주 주일)가 지나면 곡이 '연주한 찬양'으로 자동으로 옮겨집니다. 곡을 누르면 악보, 파트별 음원, 연습 포인트, 찬양가이드가 열립니다.</p>`;
};

V.members=()=>{
  const order=ALL.filter(p=>partF==="all"||p===partF);
  return `
  <section class="sec"><div class="sec-h"><h2>섬기는 소중한 분들 <span class="num" style="color:var(--leaf)">${MEMBERS.length}</span></h2><span class="small muted">노래 ${MEMBERS.length-cnt("P")} · 반주 ${cnt("P")}</span></div>${mix()}</section>
  <div class="seg" role="group" aria-label="파트">${[["all","전체"],...ALL.map(p=>[p,PARTS[p]])].map(([k,l])=>`<button data-pf="${k}" aria-pressed="${partF===k}">${l}</button>`).join("")}</div>
  <section class="sec"><div class="rows">${MEMBERS.filter(m=>order.includes(m.part)).sort(byName).map(m=>`
    <button class="r ${m.part}" data-mem="${m.id}"><span class="ini">${esc(m.name[0])}</span><div class="grow"><div class="t">${esc(m.name)} ${m.role.map(r=>`<span class="badge">${r}</span>`).join(" ")}</div><div class="small muted">${PARTS[m.part]} · ${contacts[m.id]?.phone?esc(contacts[m.id].phone):"연락처 미등록"}</div></div><span class="muted">›</span></button>`).join("")}</div>
  <p class="note">${leader()?"이름을 눌러 연락처와 생일을 입력하세요.":"연락처는 지휘자 보기에서 입력합니다."}</p></section>`;
};

V.attend=()=>{
  const ds=[...Array(12)].map((_,i)=>ymd(sch(i+1).pr));if(!attDate||!ds.includes(attDate)){const u=upcoming("pr");attDate=u?ymd(u.d):ds[11]}
  const pres=new Set(attendance[attDate]||[]);setTimeout(()=>document.querySelector("[data-ad][aria-pressed=true]")?.scrollIntoView({inline:"center",block:"nearest"}),0);const pct=Math.round(pres.size/MEMBERS.length*100),C=2*Math.PI*30;
  return `
  <div class="seg" role="group" aria-label="연습 날짜">${ds.map(d=>`<button data-ad="${d}" aria-pressed="${d===attDate}">${md(d)} 토</button>`).join("")}</div>
  <div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="30" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="38" cy="38" r="30" fill="none" stroke="var(--leaf)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 38 38)"/></svg>
    <div><div class="big num">${pres.size}<span class="small muted"> / ${MEMBERS.length}명</span></div><div class="small muted">${ALL.map(p=>`${p==="P"?"반주":p} ${MEMBERS.filter(m=>m.part===p&&pres.has(m.id)).length}/${cnt(p)}`).join(" · ")}</div></div></div>
  ${ALL.map(p=>`<section class="sec"><div class="sec-h"><h2 style="font-size:18px">${PARTS[p]}</h2></div><div class="chips">${MEMBERS.filter(m=>m.part===p).sort(byName).map(m=>`
    <button class="chip ${p}" data-att="${m.id}" aria-pressed="${pres.has(m.id)}" ${leader()?"":"disabled"}><span class="ini">${esc(m.name[0])}</span><span>${esc(m.name)}</span></button>`).join("")}</div></section>`).join("")}
  <p class="note">${leader()?"얼굴 동그라미를 누르면 출석, 다시 누르면 취소됩니다.":"출석 체크는 지휘자 보기에서 합니다."} 시안에서는 이 기기에만 저장됩니다.</p>`;
};

V.news=()=>{
  const now=curMonth(),tin=BUDGET.in.reduce((a,b)=>a+b[1],0),tout=BUDGET.out.reduce((a,b)=>a+b[1],0);
  const special=[1,3,7,11,12];
  return `
  <section class="sec"><div class="sec-h"><h2>2027 한 해</h2></div>
    <div class="year">${EVENTS.map(e=>`<button class="mo ${special.includes(e[0])?"special":""} ${e[0]===now?"now":""}" data-ev="${e[0]}"><span class="m">${e[0]}월 · ${md(sch(e[0]).pr)} / ${md(sch(e[0]).pf)}${sch(e[0]).moved?" *":""}</span><b>${esc(e[1])}</b></button>`).join("")}</div>
    <p class="note">날짜는 연습 / 연주 순서입니다. 달을 누르면 준비 사항이 나오고, 지휘자 보기에서는 날짜를 옮길 수 있습니다. 색칠된 달은 특별 찬양이 있는 달입니다.</p></section>
  <section class="sec"><div class="sec-h"><h2>이끄는 사람들</h2></div>
    <div class="rows">${Object.entries(ORG).map(([k,v])=>`<div class="r" style="cursor:default"><span class="badge">${k}</span><div class="grow t">${v}</div></div>`).join("")}</div></section>
  <section class="sec"><div class="sec-h"><h2>예산</h2><span class="small muted">단위: 원</span></div>
    <div class="rows"><table class="bud"><tbody>
      ${BUDGET.in.map(r=>`<tr><td><span class="small muted">수입</span> ${r[0]}</td><td>${r[1].toLocaleString("ko-KR")}</td></tr>`).join("")}
      ${BUDGET.out.map(r=>`<tr><td><span class="small muted">지출</span> ${r[0]}</td><td>${r[1].toLocaleString("ko-KR")}</td></tr>`).join("")}
      <tr class="sum"><td>잔액</td><td>${(tin-tout).toLocaleString("ko-KR")}</td></tr></tbody></table></div></section>
  <section class="sec"><div class="sec-h"><h2>자료실</h2></div>
    <div class="rows"><div class="r" style="cursor:default"><div class="grow small muted">발성 자료, 레파토리 목록(7월 배부)을 올리는 자리입니다.</div></div></div></section>
  ${leader()?`<button class="btn soft" id="reset">이 기기에 저장한 내용 지우기</button>`:""}
  <p class="note">시안이라 입력한 내용은 이 기기에만 저장됩니다. 실제 앱에서는 모든 대원이 같은 내용을 보도록 공유 저장소에 연결합니다.</p>`;
};

/* ===== 시트 ===== */
function openSheet(h){closeSheet();const s=document.createElement("div");s.className="scrim";s.onclick=closeSheet;const d=document.createElement("div");d.className="sheet";d.setAttribute("role","dialog");d.innerHTML='<div class="grab"></div>'+h;d.addEventListener("click",sheetClick);document.body.append(s,d)}
function closeSheet(){document.querySelectorAll(".scrim,.sheet").forEach(e=>e.remove())}
const closeBtn='<button class="link" data-close>닫기</button>';
function partLinks(s){
  const m=/^(https:\/\/[^"']+\/)pop\d+\.html$/.exec(s.url||"");
  if(!m)return `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">악보 · 음원 페이지 열기 ↗</a>`;
  const P=[["합창",1,"var(--leaf)"],["소프라노",2,"var(--s)"],["알토",3,"var(--a)"],["테너",4,"var(--t)"],["베이스",5,"var(--b)"],["반주",6,"var(--pi)"]];
  return `<div class="small muted" style="font-weight:600">파트별 연습</div><div class="parts">${P.map(([l,n,c])=>`<a href="${esc(m[1])}pop${n}.html" target="_blank" rel="noopener" data-player="${esc(s.title)} · ${l}" style="--c:${c}"><span class="play" style="background:var(--c)"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></span>${l}</a>`).join("")}</div>`;
}
function songSheet(id){const s=songs.find(x=>x.id===id);if(!s)return;lastSong=id;
  openSheet(`<div class="kv"><div style="min-width:0"><div class="small muted">${songWhen(s)} · ${esc(s.voicing)}${s.key?` · ${esc(s.key)}조`:""}</div><h2>${esc(s.title)}</h2></div>${closeBtn}</div>
  ${s.yt?ytBlock(s):""}
  ${s.url?partLinks(s):`<div class="score"><span>악보 이미지 / PDF 자리</span><span>두 손가락으로 확대</span></div>`}
  ${leader()?`<label class="f">곡 제목<input id="st-${s.id}" value="${esc(s.title)}"></label><div class="two"><label class="f">편성<input id="sv-${s.id}" value="${esc(s.voicing)}"></label><label class="f">조<input id="sk-${s.id}" value="${esc(s.key)}"></label></div><label class="f">악보·음원 링크 (중앙아트)<input id="su-${s.id}" inputmode="url" value="${esc(s.url||"")}" placeholder="https://"></label><label class="f">유튜브 링크 (합창 영상)<input id="sy-${s.id}" inputmode="url" value="${s.yt?"https://youtu.be/"+esc(s.yt):""}" placeholder="https://youtu.be/..."></label><button class="btn soft" data-saveinfo="${s.id}">곡 정보 저장</button>`:""}
  ${s.url?`<div class="note">버튼을 누르면 중앙아트 연습 화면이 열립니다. 악보와 함께 해당 파트 음원으로 연습할 수 있습니다.</div>`:`<div class="seg" role="group" aria-label="파트 음원">${[...["S","A","T","B"],"all"].map(p=>`<button data-sp="${p}" aria-pressed="${songPart===p}">${p==="all"?"전체":PARTS[p]}</button>`).join("")}</div>
  <button class="btn" data-play>▶ ${songPart==="all"?"전체":PARTS[songPart]} 음원 듣기</button>`}
  <div class="small muted" style="font-weight:600">연습 포인트</div>
  ${leader()?`<label class="f">한 줄에 하나씩<textarea id="p-${s.id}" rows="4">${esc((s.pts||[]).join("\n"))}</textarea></label><button class="btn soft" data-savepts="${s.id}">연습 포인트 저장</button>`:ptsHtml(s)||'<div class="small muted">아직 없습니다.</div>'}
  <div class="small muted" style="font-weight:600">찬양가이드</div>
  ${leader()?`<label class="f">지휘자 메모<textarea id="g-${s.id}" rows="5">${esc(s.guide)}</textarea></label><button class="btn soft" data-saveguide="${s.id}">가이드 저장</button>`:`<div class="guide">${esc(s.guide)}</div>`}`)}
function memSheet(id){const m=MEMBERS.find(x=>x.id===id),c=contacts[id]||{};
  openSheet(`<div class="kv"><div class="r ${m.part}" style="padding:0;cursor:default"><span class="ini">${esc(m.name[0])}</span><div><h2>${esc(m.name)}</h2><div class="small muted">${PARTS[m.part]}${m.role.length?" · "+m.role.join(", "):""}</div></div></div>${closeBtn}</div>
  ${leader()?`<label class="f">휴대폰<input id="ph-${id}" inputmode="tel" placeholder="010-0000-0000" value="${esc(c.phone||"")}"></label>
    <label class="f">생일<input id="bd-${id}" placeholder="예: 3월 14일" value="${esc(c.birthday||"")}"></label><button class="btn" data-savemem="${id}">저장</button>`
  :`<div class="kv"><span class="muted">휴대폰</span><span class="num" style="user-select:all">${esc(c.phone||"미등록")}</span></div>
    <div class="kv"><span class="muted">생일</span><span>${esc(c.birthday||"미등록")}</span></div>
    <div class="two"><a class="btn" ${c.phone?`href="tel:${esc(c.phone)}"`:'aria-disabled="true"'}>전화</a><a class="btn soft" ${c.phone?`href="sms:${esc(c.phone)}"`:'aria-disabled="true"'}>문자</a></div>
    ${c.phone?`<button class="link" data-copy="${esc(c.phone)}">번호 복사</button>`:""}`}`)}
function evSheet(n){const e=EVENTS[n-1],x=sch(n);
  openSheet(`<div class="kv"><div><div class="small muted">2027년 ${e[0]}월</div><h2>${esc(e[1])}</h2></div>${closeBtn}</div>
  <div class="guide">${esc(e[2]||"비고 없음")}</div>
  ${leader()?`<label class="f">연습 날짜 (기본: 연주 전날 토요일)<input type="date" id="epr" value="${ymd(x.pr)}"></label>
    <label class="f">연주 날짜 (기본: 3주 주일 3부예배)<input type="date" id="epf" value="${ymd(x.pf)}"></label>
    <div class="two"><button class="btn" data-savesch="${n}">날짜 저장</button><button class="btn soft" data-resetsch="${n}">기본 날짜로</button></div>`
  :`<div class="kv"><span class="muted">연습</span><b>${md(x.pr)} (토)</b></div><div class="kv"><span class="muted">연주</span><b>${md(x.pf)} (주일) 3부예배</b></div>`}`)}
function sheetClick(e){const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.player&&INLINE){e.preventDefault();$("#pmT").textContent=t.dataset.player;$("#pmF").src=t.href;$("#pm").hidden=false;fitPlayer();return}
  if(t.hasAttribute("data-close"))return closeSheet();
  if(t.dataset.sp){songPart=t.dataset.sp;return songSheet(lastSong)}
  if(t.dataset.savesch){const n=t.dataset.savesch,a=$("#epr").value,b=$("#epf").value,d=sch(+n);sched[n]={};const bf=b||ymd(nth(+n,0,3));if(b&&b!==ymd(nth(+n,0,3)))sched[n].pf=b;if(a&&a!==ymd(eve(parse(bf))))sched[n].pr=a;store.set("sched",sched);closeSheet();render();return toast(n+"월 날짜를 저장했습니다")}
  if(t.dataset.resetsch){delete sched[t.dataset.resetsch];store.set("sched",sched);closeSheet();render();return toast("기본 날짜로 되돌렸습니다")}
  if(t.hasAttribute("data-play"))return toast("시안: 실제 앱에서 음원이 재생됩니다");
  if(t.dataset.saveinfo){const s=songs.find(x=>x.id===t.dataset.saveinfo),g=k=>$("#"+k+"-"+s.id).value.trim();s.title=g("st")||s.title;s.voicing=g("sv");s.key=g("sk");s.url=/^https:\/\//.test(g("su"))?g("su"):"";s.yt=ytId(g("sy"));s.ex=false;store.set("songs",songs);render();songSheet(s.id);return toast("곡 정보를 저장했습니다")}
  if(t.dataset.savepts){const s=songs.find(x=>x.id===t.dataset.savepts);s.pts=$("#p-"+s.id).value.split("\n").map(x=>x.trim()).filter(Boolean);store.set("songs",songs);render();return toast("연습 포인트를 저장했습니다")}
  if(t.dataset.saveguide){const s=songs.find(x=>x.id===t.dataset.saveguide);s.guide=$("#g-"+s.id).value;store.set("songs",songs);return toast("가이드를 저장했습니다")}
  if(t.dataset.savemem){const id=t.dataset.savemem;contacts[id]={phone:$("#ph-"+id).value.trim(),birthday:$("#bd-"+id).value.trim()};store.set("contacts",contacts);closeSheet();render();return toast("저장했습니다")}
  if(t.dataset.copy){const v=t.dataset.copy;try{navigator.clipboard.writeText(v).then(()=>toast("번호를 복사했습니다"),()=>toast(v))}catch(_){toast(v)}}
}

/* ===== 라우팅 ===== */
const INLINE=/github\.io$/.test(location.hostname); /* GitHub Pages에서는 앱 안 팝업, 그 밖에서는 새 창 */
function fitPlayer(){}
addEventListener("resize",()=>{if(!$("#pm").hidden)fitPlayer()});
function closePlayer(){$("#pm").hidden=true;$("#pmF").src="about:blank"}
$("#pmX").onclick=closePlayer;$("#pm").addEventListener("click",e=>{if(e.target.id==="pm")closePlayer()});
const TABS=["home","music","members","attend","news"];
function render(){const t=TABS.includes(location.hash.slice(1))?location.hash.slice(1):"home";
  $("#staff").innerHTML=t==="home"?staff():"";
  $("#view").innerHTML=V[t]();
  document.querySelectorAll("nav.pill a").forEach(a=>a.dataset.t===t?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("#whoLab").textContent=leader()?"지휘자":"대원";}
window.addEventListener("hashchange",()=>{closeSheet();render();window.scrollTo(0,0)});
$("#who").onclick=()=>{role=leader()?"member":"leader";store.set("role",role);render();toast(leader()?"지휘자 보기: 편집할 수 있습니다":"대원 보기로 바꿨습니다")};
$("#view").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.song)return songSheet(t.dataset.song);
  if(t.dataset.mem)return memSheet(t.dataset.mem);
  if(t.dataset.ev)return evSheet(+t.dataset.ev);
  if(t.dataset.cat){cat=t.dataset.cat;return render()}
  if(t.dataset.pf){partF=t.dataset.pf;return render()}
  if(t.dataset.ad){attDate=t.dataset.ad;return render()}
  if(t.dataset.att&&leader()){const a=new Set(attendance[attDate]||[]);a.has(t.dataset.att)?a.delete(t.dataset.att):a.add(t.dataset.att);attendance[attDate]=[...a];store.set("att",attendance);return render()}
  if(t.dataset.addm!==undefined){const m=+t.dataset.addm,id="s"+Date.now();songs.push(m?{id,m,title:"새 찬양곡",voicing:"SATB",key:"C",guide:"",pts:[],ex:true}:{id,cat:"송영곡",title:"새 송영곡",voicing:"SATB",key:"C",guide:"",pts:[],ex:true});store.set("songs",songs);render();return songSheet(id)}
  if(t.id==="reset"){contacts={};attendance={};songs=SONGS_SEED.map(s=>({...s}));store.set("contacts",{});store.set("att",{});sched={};store.set("sched",{});store.set("songs",null);render();return toast("이 기기 저장 내용을 지웠습니다")}
});
render();
</script>
